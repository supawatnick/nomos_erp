[project]
name = "nomos-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic-settings>=2.5,<3","sqlalchemy>=2.0,<3","psycopg[binary]>=3.2,<4","alembic>=1.13,<2","structlog>=24,<26"]
[project.optional-dependencies]
dev = ["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.6,<1","mypy>=1.11,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.mypy]
python_version = "3.12"
strict = true
