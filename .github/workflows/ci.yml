name: ci
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: nomos, POSTGRES_USER: nomos, POSTGRES_PASSWORD: change-me-local-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nomos -d nomos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nomos:change-me-local-only@localhost:5432/nomos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/pip install -e './apps/api[dev]' pip-audit
      - run: .venv/bin/pip-audit
      - run: .venv/bin/ruff check apps/api
      - run: .venv/bin/mypy apps/api/app
      - run: ../../.venv/bin/pytest -q
        working-directory: apps/api
      - run: ../../.venv/bin/alembic upgrade head
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
