name: ci
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: nomos, POSTGRES_USER: nomos, POSTGRES_PASSWORD: change-me-local-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nomos -d nomos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nomos:change-me-local-only@localhost:5432/nomos
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.3', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt pip-audit
      - run: ruff check apps/api
      - run: mypy apps/api/app
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api
      - run: pip-audit -r apps/api/requirements.txt
      - run: npm ci
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: apps/web
      - name: Run gitleaks secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose
